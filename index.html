<!doctype html> 
<html class="landing" lang="en" manifest="cache.manifest"> 
<head> 
<meta charset="utf-8" /> 
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no" /> 
<title>AJZA ALHASB JAILBREAK 0558028009</title> 
<style> 
/* 1. LOCK VIEWPORT ROOT AND HIDE OVERFLOWS */ 
html, body { 
    margin: 0; padding: 0; background-image: url('image.png'); background-repeat: no-repeat; background-attachment: fixed; background-position: center center; background-size: 100% 100%; overflow: hidden; background-color: #252526; color: #1f1f1f; font: 15px/1.45 "Segoe UI", system-ui, sans-serif;}
/* 2. KEEP ORIGINAL HEADER LOOK EXACTLY AS IS */ 
#brand { display: flex; align-items: center; justify-content: center; gap: 12px; padding: 20px 15px;} 
#brand img { width: 160px; height: 48px; object-fit: contain; } 
#brand b { font-size: 40px; font-weight: 800; letter-spacing: .08em; color: var(--text-primary, #ffffff); text-transform: uppercase; background: linear-gradient(90deg, #ffffff 0%, #a3b3cc 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; } 
/* 3. KEEP ORIGINAL FIXED CONTACT BOX POSITION */ 
.contact-box { position: fixed; bottom: 30px; left: 0; right: 0; text-align: center; z-index: 10; } 
.contact-number { font-size: 20px; font-weight: 800; color: #7fd0a0; letter-spacing: 0.5px; padding: 8px 16px; border-radius: 20px; } 
body.log .contact-box { display: none; } 
/* 4. THE FIX: RE-CENTER CONTENT WITHIN THE REMAINING AREA ONLY */ 
.shell { display: flex; justify-content: center; align-items: center; /* Automatically subtracts the height of your stacked header elements */ height: calc(100vh - 180px); max-height: calc(100vh - 180px); box-sizing: border-box; padding-bottom: 40px; /* Gently shifts up to leave pristine space for the bottom contact box */ overflow: hidden; } 
.panel { display: flex; flex-direction: column; align-items: center; } 
.pick { display: flex; flex-direction: column; align-items: center; gap: 20px; } 
/* CENTERED BUTTON AREA */ 
.count { width: 220px; height: 220px; border-radius: 50%; border: 3px dashed #3bd8ff; background: transparent; color: #ffffff; cursor: pointer; display: flex; flex-direction: column; justify-content: center; align-items: center; box-shadow: inset 0 0 15px rgba(0, 191, 255, 0.1), 0 0 10px #00bfff; z-index: 2; outline: none; } 
.count:hover { box-shadow: inset 0 0 20px rgba(0, 216, 255, 0.2), 0 0 14px #00d8ff; border-color: #00d8ff; } 
.count:disabled { border-color: rgba(30, 39, 50, 0.5); box-shadow: none; cursor: default; } 
/* STYLING FOR THE BUTTON INSIDE THE CIRCLE */ 
.btn { background: transparent; border: none; color: #ffffff; font-size: 35px; font-weight: bold; text-transform: uppercase; cursor: pointer; width: 100%; height: 100%; border-radius: 50%; } 
/* MARGINS FOR THE BELOW ELEMENTS */ 
.lede { margin: 15px 0 5px 0; font-size: 16px; font-weight: 500; color: #f6f6fa; } 
.opt { display: flex; align-items: center; gap: 8px; font-size: 20px; font-weight: 800; color: #fffffd; } 
</style> 
</head> 
<body> 
<div id="brand"> <img src="logo_raw.png" alt="" width="28" height="28"> </div> 
<div id="brand"><b>AJZA ALHASB JAILBREAK</b></div> 
<div class="shell"> 
<main class="panel"> 
<form class="pick" id="pick"> 
<div class="count" id="count"> 
<button class="btn" id="start-btn" type="submit">start</button> 
</div> 
<p class="lede" id="status-lede"></p> 
<label class="opt"> 
<span id="instruction-text"></span> 
</label> 
</form> 
</main> 
</div> 
<div class="contact-box"> 
<div class="contact-number"></div> 
</div> 
<script src="launch.js"></script> 
<script>
// Cache Process Listener
if (window.applicationCache) {
    var appCache = window.applicationCache;
    var statusLede = document.getElementById('status-lede');
    var startBtn = document.getElementById('start-btn');
    var insText = document.getElementById('instruction-text');

    appCache.addEventListener('checking', function() {
        statusLede.innerHTML = "PS4 kernel exploit &middot; firmware 12.00 and 14.02";
    }, false);

    appCache.addEventListener('downloading', function() {
        statusLede.innerHTML = "Downloading offline cache...";
        startBtn.disabled = true;
        startBtn.innerHTML = "WAIT";
        insText.innerHTML = "Caching files, please do not close browser.";
    }, false);

    appCache.addEventListener('progress', function(e) {
        if (e.lengthComputable) {
            var percent = Math.round((e.loaded / e.total) * 100);
            statusLede.innerHTML = "Caching files: " + percent + "%";
        }
    }, false);

    appCache.addEventListener('cached', function() {
        statusLede.innerHTML = "Cache Installed successfully!";
        startBtn.disabled = false;
        startBtn.innerHTML = "START";
        insText.innerHTML = "Turn off internet and restart browser to test.";
    }, false);

    appCache.addEventListener('updateready', function() {
        if (appCache.status == appCache.UPDATEREADY) {
            appCache.swapCache();
            statusLede.innerHTML = "Cache updated! Reloading...";
            setTimeout(function() { window.location.reload(); }, 2000);
        }
    }, false);

    appCache.addEventListener('noupdate', function() {
        statusLede.innerHTML = "PS4 kernel exploit &middot; firmware 12.00 and 14.02";
    }, false);

    appCache.addEventListener('error', function() {
        // Only show error if the user is online and it actually fails
        if (navigator.onLine) {
            statusLede.innerHTML = "Error caching files. Retrying...";
        }
    }, false);
}
</script>
</body> 
</html>
